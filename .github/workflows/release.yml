name: Release & Distribute

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version to release (e.g. v0.3.0)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Determine Version
        id: version_step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Tag: $TAG, Version: $VERSION"

      - name: Build All Platform Binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION}"

          # Linux AMD64 & ARM64
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/gryd-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/gryd-linux-arm64 .

          # macOS (Darwin) AMD64 & ARM64
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/gryd-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/gryd-darwin-arm64 .

          # Windows AMD64 & ARM64
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/gryd-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/gryd-windows-arm64.exe .

      - name: Package Archives
        run: |
          mkdir -p artifacts
          cd dist

          # Tarballs for macOS and Linux
          tar -czf ../artifacts/gryd_linux_amd64.tar.gz -C . --transform 's|gryd-linux-amd64|gryd|' gryd-linux-amd64
          tar -czf ../artifacts/gryd_linux_arm64.tar.gz -C . --transform 's|gryd-linux-arm64|gryd|' gryd-linux-arm64
          tar -czf ../artifacts/gryd_darwin_amd64.tar.gz -C . --transform 's|gryd-darwin-amd64|gryd|' gryd-darwin-amd64
          tar -czf ../artifacts/gryd_darwin_arm64.tar.gz -C . --transform 's|gryd-darwin-arm64|gryd|' gryd-darwin-arm64

          # Zip archives for Windows (containing gryd.exe)
          cp gryd-windows-amd64.exe gryd.exe && zip ../artifacts/gryd_windows_amd64.zip gryd.exe && rm gryd.exe
          cp gryd-windows-arm64.exe gryd.exe && zip ../artifacts/gryd_windows_arm64.zip gryd.exe && rm gryd.exe

          cd ..

      - name: Generate Checksums
        id: checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

          echo "DARWIN_ARM64_SHA=$(sha256sum gryd_darwin_arm64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "DARWIN_AMD64_SHA=$(sha256sum gryd_darwin_amd64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "LINUX_ARM64_SHA=$(sha256sum gryd_linux_arm64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "LINUX_AMD64_SHA=$(sha256sum gryd_linux_amd64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "WINDOWS_AMD64_SHA=$(sha256sum gryd_windows_amd64.zip | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "WINDOWS_ARM64_SHA=$(sha256sum gryd_windows_arm64.zip | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: |
            artifacts/gryd_*
            artifacts/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      tag: ${{ env.TAG }}
      version: ${{ env.VERSION }}
      darwin_arm64_sha: ${{ steps.checksums.outputs.DARWIN_ARM64_SHA }}
      darwin_amd64_sha: ${{ steps.checksums.outputs.DARWIN_AMD64_SHA }}
      linux_arm64_sha: ${{ steps.checksums.outputs.LINUX_ARM64_SHA }}
      linux_amd64_sha: ${{ steps.checksums.outputs.LINUX_AMD64_SHA }}
      windows_amd64_sha: ${{ steps.checksums.outputs.WINDOWS_AMD64_SHA }}
      windows_arm64_sha: ${{ steps.checksums.outputs.WINDOWS_ARM64_SHA }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: 'Sidharth-Prabhu/homebrew-tap'
          token: ${{ secrets.RELEASE_PAT }}
          path: homebrew-tap

      - name: Update gryd Formula
        run: |
          cd homebrew-tap
          cat << 'EOF' > Formula/gryd.rb
          class Gryd < Formula
            desc "Multi-service development orchestrator and interactive TUI dashboard"
            homepage "https://github.com/Sidharth-Prabhu/gryd"
            version "${{ needs.build-and-release.outputs.version }}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/Sidharth-Prabhu/gryd/releases/download/${{ needs.build-and-release.outputs.tag }}/gryd_darwin_arm64.tar.gz"
                sha256 "${{ needs.build-and-release.outputs.darwin_arm64_sha }}"
              else
                url "https://github.com/Sidharth-Prabhu/gryd/releases/download/${{ needs.build-and-release.outputs.tag }}/gryd_darwin_amd64.tar.gz"
                sha256 "${{ needs.build-and-release.outputs.darwin_amd64_sha }}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/Sidharth-Prabhu/gryd/releases/download/${{ needs.build-and-release.outputs.tag }}/gryd_linux_arm64.tar.gz"
                sha256 "${{ needs.build-and-release.outputs.linux_arm64_sha }}"
              else
                url "https://github.com/Sidharth-Prabhu/gryd/releases/download/${{ needs.build-and-release.outputs.tag }}/gryd_linux_amd64.tar.gz"
                sha256 "${{ needs.build-and-release.outputs.linux_amd64_sha }}"
              end
            end

            def install
              bin.install "gryd"
            end

            test do
              system "#{bin}/gryd", "--version"
            end
          end
          EOF
          # Remove 10 leading spaces indentation from the here-doc
          sed -i 's/^          //' Formula/gryd.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/gryd.rb
          if git diff --staged --quiet; then
            echo "No changes to Formula"
          else
            git commit -m "chore(formula): bump gryd to ${{ needs.build-and-release.outputs.tag }}"
            git push origin main
          fi

  update-winget:
    name: Submit Winget Package Update
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Submit to WinGet via winget-pkgs PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const version = "${{ needs.build-and-release.outputs.version }}";
            const tag = "${{ needs.build-and-release.outputs.tag }}";
            const winAmd64Sha = "${{ needs.build-and-release.outputs.windows_amd64_sha }}";
            const winArm64Sha = "${{ needs.build-and-release.outputs.windows_arm64_sha }}";
            const today = new Date().toISOString().split('T')[0];

            const versionYaml = `# yaml-language-server: $schema=https://aka.ms/winget-manifest.version.1.6.0.schema.json
          PackageIdentifier: SidharthPrabhu.Gryd
          PackageVersion: ${version}
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          `.replace(/^          /gm, '');

            const localeYaml = `# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.6.0.schema.json
          PackageIdentifier: SidharthPrabhu.Gryd
          PackageVersion: ${version}
          PackageLocale: en-US
          Publisher: Sidharth Prabhu
          PublisherUrl: https://github.com/Sidharth-Prabhu
          PublisherSupportUrl: https://github.com/Sidharth-Prabhu/gryd/issues
          Author: Sidharth Prabhu
          PackageName: Gryd
          PackageUrl: https://github.com/Sidharth-Prabhu/gryd
          License: MIT
          LicenseUrl: https://github.com/Sidharth-Prabhu/gryd/blob/main/LICENSE
          ShortDescription: Terminal UI and development orchestrator for managing multi-service fullstack applications.
          Description: |-
            Gryd is a cross-platform multi-service development orchestrator and interactive TUI dashboard.
            It provides real-time logs, process control, health monitoring, resource usage metrics, and Cloudflare tunnel sharing.
          Moniker: gryd
          Tags:
            - cli
            - developer-tools
            - microservices
            - orchestration
            - terminal
            - tui
          ReleaseNotesUrl: https://github.com/Sidharth-Prabhu/gryd/releases/tag/${tag}
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          `.replace(/^          /gm, '');

            const installerYaml = `# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
          PackageIdentifier: SidharthPrabhu.Gryd
          PackageVersion: ${version}
          InstallerLocale: en-US
          InstallerType: zip
          ReleaseDate: "${today}"
          Installers:
            - Architecture: x64
              NestedInstallerType: portable
              NestedInstallerFiles:
                - RelativeFilePath: gryd.exe
                  PortableCommandAlias: gryd
              InstallerUrl: https://github.com/Sidharth-Prabhu/gryd/releases/download/${tag}/gryd_windows_amd64.zip
              InstallerSha256: ${winAmd64Sha}
              UpgradeBehavior: uninstallPrevious
            - Architecture: arm64
              NestedInstallerType: portable
              NestedInstallerFiles:
                - RelativeFilePath: gryd.exe
                  PortableCommandAlias: gryd
              InstallerUrl: https://github.com/Sidharth-Prabhu/gryd/releases/download/${tag}/gryd_windows_arm64.zip
              InstallerSha256: ${winArm64Sha}
              UpgradeBehavior: uninstallPrevious
          ManifestType: installer
          ManifestVersion: 1.6.0
          `.replace(/^          /gm, '');

            const forkOwner = 'Sidharth-Prabhu';
            const forkRepo = 'winget-pkgs';
            const upstreamOwner = 'microsoft';
            const upstreamRepo = 'winget-pkgs';
            const branchName = `sidharthprabhu-gryd-${version}`;
            const basePath = `manifests/s/SidharthPrabhu/Gryd/${version}`;

            // 1. Get default branch SHA of fork
            const { data: refData } = await github.rest.git.getRef({
              owner: forkOwner,
              repo: forkRepo,
              ref: 'heads/master',
            });
            const masterSha = refData.object.sha;

            // 2. Create branch on fork
            try {
              await github.rest.git.createRef({
                owner: forkOwner,
                repo: forkRepo,
                ref: `refs/heads/${branchName}`,
                sha: masterSha,
              });
              console.log(`Created branch ${branchName}`);
            } catch (e) {
              console.log(`Branch ${branchName} already exists or error:`, e.message);
            }

            // 3. Commit the 3 manifest files
            const files = [
              { path: `${basePath}/SidharthPrabhu.Gryd.yaml`, content: versionYaml },
              { path: `${basePath}/SidharthPrabhu.Gryd.locale.en-US.yaml`, content: localeYaml },
              { path: `${basePath}/SidharthPrabhu.Gryd.installer.yaml`, content: installerYaml }
            ];

            for (const f of files) {
              let sha = undefined;
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: forkOwner,
                  repo: forkRepo,
                  path: f.path,
                  ref: branchName,
                });
                sha = data.sha;
              } catch (e) {
                // File does not exist yet
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner: forkOwner,
                repo: forkRepo,
                path: f.path,
                message: `New package: SidharthPrabhu.Gryd version ${version}`,
                content: Buffer.from(f.content).toString('base64'),
                branch: branchName,
                sha: sha,
              });
              console.log(`Uploaded ${f.path}`);
            }

            // 4. Open Pull Request on microsoft/winget-pkgs
            try {
              const { data: pr } = await github.rest.pulls.create({
                owner: upstreamOwner,
                repo: upstreamRepo,
                title: `New package: SidharthPrabhu.Gryd version ${version}`,
                head: `${forkOwner}:${branchName}`,
                base: 'master',
                body: `### Package Identifier: SidharthPrabhu.Gryd\n### Package Version: ${version}\n\nAutomated package release submission for Gryd ${version}.`,
              });
              console.log(`PR created: ${pr.html_url}`);
            } catch (e) {
              console.log('PR creation response / note:', e.message);
            }
